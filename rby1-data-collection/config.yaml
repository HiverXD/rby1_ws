# demo collection
task_name: "PuttingCupintotheDish" # 데모 저장 디렉토리를 지정하기 위한 config
# demo_root: '/media/nvidia/T7/Demo/' # ssh로 user pc에서 했을 때
demo_root: 'rby1-data-collection/Demo/'

# dataset config
FPS: 10

# dataset conversion
conversion_task_name: "PuttingCupintotheDish" # 어떤 task의 데모를 변환할 것인지 지정하기 위한 config

user_name : "edipark" # Hugging Face 데이터 push를 위한 user name

# connection 
user_pc_ip: "192.168.0.50:50051" # user pc
metaquest_ip: "192.168.0.36" # metaquest
local_ip: "192.168.0.27" # 실제 이 컴퓨터 ip (migrated. user pc 아님)
# local_ip: "192.168.0.39" # user pc에서 실행할 때

remote_gripper_host: "192.168.0.56"
remote_gripper_port: 5009
remote_gripper_timeout: 30

# Elbow angle threshold for starting condition
elbow_angle_threshold_deg: 90

cameras:
  head:
    namespace: "camera"
    serial: "922612070040"
    color: "/camera/camera/color/image_raw"
    depth: "/camera/camera/depth/image_rect_raw"
  # right:
  #   namespace: "camera"
  #   serial: "838212074317"
  #   color: "/camera/camera/color/image_raw"
  #   depth: "/camera/camera/depth/image_rect_raw"
  left:
    namespace: "camera2"
    serial: "838212070714"
    color: "/camera2/camera/color/image_raw"
    depth: "/camera2/camera/depth/image_rect_raw"

cam_node_num: 3

