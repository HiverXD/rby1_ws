# demo collection
task_name: "PuttingCupintotheDishV2" # 데모 저장 디렉토리를 지정하기 위한 config
# demo_root: '/media/nvidia/T7/Demo/' # ssh로 user pc에서 했을 때
demo_root: '/media/hyunjin/T7/rby1_demo/' # 직접 이 컴퓨터에서 했을 때

# dataset config
rec_fps: 15  # recording FPS for demo logger thread

# dataset conversion
v3_dataset_saving_root: "/media/hyunjin/T7/rby1_demo/LeRobotDataset_v3"
v2_dataset_saving_root: "/media/hyunjin/T7/rby1_demo/LeRobotDataset_v2"
conversion_task_name: "PuttingCupintotheDishV2" # "PuttingCupintotheDish" # 어떤 task의 데모를 변환할 것인지 지정하기 위한 config
# h5 -> LeRobotDataset v3으로 1차적으로 /media/hyunjin/T7/rby1_demo/LeRobotDataset_v3/{conversion_task_name}에 저장한 후
# v3 -> v2로 2차적으로 변환된 최종 데이터셋은  /media/hyunjin/T7/rby1_demo/LeRobotDataset_v2/{conversion_task_name}에 저장됩니다. 

user_name : "edipark" # Hugging Face 데이터 push를 위한 user name

# connection 
user_pc_ip: "192.168.0.50:50051" # user pc
metaquest_ip: "192.168.0.39" # metaquest
local_ip: "192.168.0.27" # 실제 이 컴퓨터 ip (migrated. user pc 아님)
# local_ip: "192.168.0.39" # user pc에서 실행할 때

remote_gripper_host: "192.168.0.56"
remote_gripper_port: 5009
remote_gripper_timeout: 30

# Master Arm 서버 (master_arm_server.py 가 실행되는 Robot PC)
remote_master_arm_host: "192.168.0.56"   # Robot PC IP
remote_master_arm_state_port: 5010       # 서버→클라이언트 상태 스트리밍
remote_master_arm_cmd_port: 5011         # 클라이언트→서버 명령

# Elbow angle threshold for starting condition
elbow_angle_threshold_deg: 90

cameras:
  head:
    namespace: "camera"
    serial: "922612070040"
    color: "/camera/camera/color/image_raw"
    depth: "/camera/camera/depth/image_rect_raw"
  right:
    namespace: "camera2"
    serial: "838212074317"
    color: "/camera2/camera/color/image_raw"
    depth: "/camera2/camera/depth/image_rect_raw"
  left:
    namespace: "camera3"
    serial: "838212070714"
    color: "/camera3/camera/color/image_raw"
    depth: "/camera3/camera/depth/image_rect_raw"

cam_node_num: 3

img_size:
  width: 640
  height: 480
